<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contato | Loja Marca d'água</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <!--Cabeçalho com nome da loja e menu de navegação-->
    <h1>Loja Marca d'água</h1>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="produtos.html">Produtos</a></li>
        <li><a href="contato.html" class="active">Contato</a></li>
        <li><a href="sobre.html">Sobre</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    <!--Área principal com o formulário de contato-->
    <div class="content-box">
      <h2 class="page-title">Fale Conosco</h2>
      <form action="#" method="post">
        <!--Formulário para envio de mensagem-->
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required />
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required />
        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="6" required></textarea>
        <button type="submit" class="btn btn-comprar">Enviar Mensagem</button>
      </form>
    </div>
  </main>
  <footer>
    <!--Rodapé com informações de contato e redes sociais-->
    <p>&copy; 2025 Loja Marca d'água</p>
    <div class="redes-sociais">
      <a href="https://facebook.com" target="_blank">📘 Facebook</a> |
      <a href="https://instagram.com" target="_blank">📸 Instagram</a> |
      <a href="https://web.whatsapp.com/" target="_blank">💬 WhatsApp</a> | 📧
      Contato: <a href="mailto:contato@marcadagualoja.com">contato@marcadagualoja.com</a>
    </div>
  </footer>
</body>

</html>
